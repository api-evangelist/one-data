name: One Data
description: 'One Data is a German enterprise software company (onedata.ai, formerly onedata.de) whose
  AI-native platform transforms legacy and fragmented enterprise data into trusted, governed, AI-ready
  data products. Its capabilities span metadata management, data quality assurance, data-product
  lifecycle management, SAP BW migration optimization, process-mining foundations, and sovereign data
  management for public-sector organizations. One Data is certified to ISO 27001:2022, ISO 9001:2015,
  and TISAX, and is a portfolio company of HV Capital. As of this enrichment pass One Data publishes no
  public developer API, OpenAPI definition, developer portal, or GitHub organization — its customer
  portal and documentation are authentication-gated.'
